[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agent"
version = "0.2.0"
description = "Autonomous SRE incident investigation and remediation, built on LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "httpx==0.25.2",
    "asyncpg==0.29.0",
    "openai>=1.40",
    "langgraph>=1.0,<2",
    "chromadb>=0.5.0",
    "numpy<2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sre_agent = ["api/static/*.html", "graphs/remediation/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
